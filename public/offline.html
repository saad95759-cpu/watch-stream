<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch Party - Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #030712;
        --card-bg: rgba(17, 24, 39, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --primary: #00f0ff;
        --primary-glow: rgba(0, 240, 255, 0.15);
      }
      
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
        top: 20%;
        left: 20%;
        z-index: 1;
        pointer-events: none;
      }

      body::after {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
        bottom: 20%;
        right: 20%;
        z-index: 1;
        pointer-events: none;
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 48px 32px;
        border-radius: 24px;
        border: 1px solid var(--border);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        max-width: 420px;
        width: 90%;
        z-index: 2;
        animation: fadeIn 0.8s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .icon {
        font-size: 48px;
        margin-bottom: 20px;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 12px 0;
        background: linear-gradient(135deg, #ffffff 30%, #a5f3fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: var(--text-muted);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 32px 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        background: linear-gradient(135deg, #00f0ff 0%, #00b8ff 100%);
        color: #030712;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.25s ease;
        box-shadow: 0 4px 12px var(--primary-glow);
        border: none;
        cursor: pointer;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🌐</div>
      <h1>You are offline</h1>
      <p>Watch Party requires an active internet connection to synchronize playback with others.</p>
      <a href="/watch-party/" class="btn">Try Again</a>
    </div>
  </body>
</html>
